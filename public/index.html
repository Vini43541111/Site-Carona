<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaronaUni – Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg); }

    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }

    .login-top {
      background: linear-gradient(135deg, #060b12 0%, #12263c 55%, #0b3d24 100%);
      padding: 2rem 2rem 1.75rem;
      text-align: center;
      color: #fff;
      border-bottom: 1px solid var(--border);
    }

    .login-logo {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: .5px;
      margin-bottom: .25rem;
    }
    .login-logo span { font-weight: 300; }

    .login-subtitle {
      font-size: .82rem;
      opacity: .8;
      margin-bottom: 1.25rem;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: rgba(255,255,255,.15);
      border-radius: 20px;
      padding: .3rem .8rem;
      font-size: .76rem;
      border: 1px solid rgba(255,255,255,.25);
    }

    .login-body { padding: 1.75rem 2rem 2rem; }

    .login-footer {
      background: var(--surface-2);
      padding: .9rem 2rem;
      text-align: center;
      font-size: .8rem;
      color: var(--text-light);
      border-top: 1px solid var(--border);
    }

    .input-icon-wrap { position: relative; }
    .input-icon { position: absolute; left: .8rem; top: 50%; transform: translateY(-50%); font-size: .95rem; color: var(--text-light); }
    .input-icon-wrap .form-control { padding-left: 2.4rem; }

    .register-link { color: var(--secondary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-logo">🎓 <span>Carona</span>Uni</div>
    <div style="color:rgba(255,255,255,.7); font-size:.82rem;">Unoesc · Plataforma Acadêmica</div>
  </header>

  <div class="login-wrap">
    <div class="login-box">
      <div class="login-top">
        <div class="login-logo">🚗 <span>Carona</span>Uni</div>
        <div class="login-subtitle">Plataforma de Caronas Universitárias</div>
        <div class="login-badge">🏫 Unoesc — acesso exclusivo a estudantes</div>
      </div>

      <div class="login-body">

        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label">E-mail</label>
            <div class="input-icon-wrap">
              <span class="input-icon">📧</span>
              <input type="email" name="email" class="form-control" placeholder="seuemail@unoesc.edu.br" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Senha</label>
            <div class="input-icon-wrap">
              <span class="input-icon">🔑</span>
              <input type="password" name="senha" class="form-control" placeholder="••••••••" required />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg mt-sm">
            Entrar →
          </button>
        </form>

      </div>
      <div class="login-footer">
        Ainda não tem conta? <a href="#" class="register-link" onclick="event.preventDefault(); openModal('modal-cadastro');">Criar conta</a>
      </div>
    </div>
  </div>

  <!-- Modal Cadastro -->
  <div class="modal-overlay" id="modal-cadastro">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">📝 Criar conta</div>
        <button class="modal-close" aria-label="Fechar" onclick="closeModal('modal-cadastro')">✕</button>
      </div>
      <form onsubmit="handleCadastro(event)">
        <div class="form-group">
          <label class="form-label">Nome completo</label>
          <input type="text" id="c-nome" class="form-control" required />
        </div>
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input type="email" id="c-email" class="form-control" placeholder="seuemail@unoesc.edu.br" required />
        </div>
        <div class="form-group">
          <label class="form-label">Matrícula</label>
          <input type="text" id="c-matricula" class="form-control" required />
        </div>
        <div class="form-group">
          <label class="form-label">Curso</label>
          <input type="text" id="c-curso" class="form-control" />
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" id="c-senha" class="form-control" required minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Cadastrar e entrar →</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // chegou aqui porque o token expirou no meio do uso
    if (new URLSearchParams(location.search).get('expirou')) {
      showToast('Sua sessão expirou. Entre novamente.', 'info');
      history.replaceState(null, '', 'index.html');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const email = form.email.value.trim();
      const senha = form.senha.value;
      try {
        const d = await api('POST', '/login', { email, senha });
        salvarSessao(d.token, d.usuario);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showToast(err.message, 'warning');
      }
    }

    async function handleCadastro(e) {
      e.preventDefault();
      const nome      = document.getElementById('c-nome').value.trim();
      const email     = document.getElementById('c-email').value.trim();
      const matricula = document.getElementById('c-matricula').value.trim();
      const curso     = document.getElementById('c-curso').value.trim();
      const senha     = document.getElementById('c-senha').value;
      try {
        await api('POST', '/usuarios', { nome, email, matricula, curso, senha });
        const d = await api('POST', '/login', { email, senha });
        salvarSessao(d.token, d.usuario);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showToast(err.message, 'warning');
      }
    }
  </script>
</body>
</html>
